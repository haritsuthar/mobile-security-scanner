<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mobile Security Scanner</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            background:#020617;

            font-family:Arial, sans-serif;

            color:white;

            display:flex;

            justify-content:center;

            align-items:center;

            height:100vh;
        }

        .container{

            width:450px;

            background:#111827;

            padding:40px;

            border-radius:20px;

            box-shadow:0 0 30px rgba(0,255,255,0.15);

            text-align:center;
        }

        h1{

            margin-bottom:15px;

            font-size:32px;

            color:#38bdf8;
        }

        p{

            color:#94a3b8;

            margin-bottom:30px;

            font-size:15px;
        }

        .upload-box{

            border:2px dashed #38bdf8;

            padding:30px;

            border-radius:15px;

            margin-bottom:25px;

            transition:0.3s;
        }

        .upload-box:hover{

            background:#0f172a;
        }

        input[type=file]{

            color:white;
        }

        button{

            width:100%;

            padding:15px;

            border:none;

            border-radius:12px;

            background:#0ea5e9;

            color:white;

            font-size:16px;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{

            background:#0284c7;
            transform:scale(1.02);
        }

        .footer{

            margin-top:20px;

            color:#64748b;

            font-size:13px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>📱 Mobile Security Scanner</h1>

        <p>Upload APK files to analyze vulnerabilities and security risks.</p>

        <form action="/scan" method="POST" enctype="multipart/form-data">

            <div class="upload-box">

              <label for="file">Choose APK file</label>
              <input type="file" id="file" name="apk" accept="application/vnd.android.package-archive,.apk" required>
            </div>

            <button type="submit">

                🚀 Start Security Scan

            </button>

        </form>

        <div class="footer">

            Flask • Cybersecurity • APK Analysis

        </div>

    </div>

</body>

</html>
